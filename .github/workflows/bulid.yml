name: Unpack ZIP and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack ZIP to Workspace Root
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unpacking $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d .
          else
            echo "No zip file found in root, proceeding with existing files."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            # في حال تم استخراج المشروع داخل مجلد فرعي داخل الـ ZIP
            SUB_DIR=$(find . -mindepth 2 -maxdepth 2 -name "gradlew" -exec dirname {} \;)
            if [ -n "$SUB_DIR" ]; then
              cd "$SUB_DIR"
              chmod +x gradlew
              echo "PROJECT_DIR=$SUB_DIR" >> $GITHUB_ENV
            else
              echo "Error: gradlew file not found after unzipping."
              exit 1
            fi
          fi

      - name: Build Debug APK
        run: |
          if [ -n "$PROJECT_DIR" ]; then
            cd "$PROJECT_DIR"
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
