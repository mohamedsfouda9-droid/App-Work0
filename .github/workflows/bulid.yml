name: Build APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Unpack Project ZIP if exists
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip '*.zip' -d extracted_project
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          elif [ -f "extracted_project/gradlew" ]; then
            chmod +x extracted_project/gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          elif [ -f "extracted_project/gradlew" ]; then
            cd extracted_project && ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found, please ensure project structure is complete."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk
