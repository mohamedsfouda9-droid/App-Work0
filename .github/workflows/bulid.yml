name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build APK
        run: |
          # البحث عن ملف gradlew في أي مجلد فرعي وإعطاؤه الصلاحية
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            # إذا كان داخل مجلد فرعي
            GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
            if [ -n "$GRADLEW_PATH" ]; then
              PROJECT_DIR=$(dirname "$GRADLEW_PATH")
              echo "Found project at: $PROJECT_DIR"
              cd "$PROJECT_DIR"
              chmod +x gradlew
              ./gradlew assembleDebug --no-daemon --stacktrace
            else
              echo "Error: gradlew not found. Trying gradle command fallback..."
              gradle assembleDebug --no-daemon --stacktrace
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/app-debug.apk
