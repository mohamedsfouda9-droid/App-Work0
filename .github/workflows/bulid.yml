name: Build APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Unpack Project ZIP if exists
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            mkdir -p extracted_project
            unzip -q '*.zip' -d extracted_project
          fi

      - name: Locate Gradle Project Root
        id: locate_gradle
        run: |
          if [ -f "gradlew" ]; then
            echo "path=." >> $GITHUB_OUTPUT
          elif [ -f "extracted_project/gradlew" ]; then
            echo "path=extracted_project" >> $GITHUB_OUTPUT
          else
            echo "Gradle wrapper not found in root or extracted directory."
            exit 1
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ${{ steps.locate_gradle.outputs.path }}/gradlew

      - name: Build Debug APK
        run: |
          cd ${{ steps.locate_gradle.outputs.path }}
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
